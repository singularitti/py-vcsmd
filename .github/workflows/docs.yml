name: Build Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.12.13
      - name: Install documentation dependencies
        run: uv sync --locked --group docs --no-default-groups
      - name: Build documentation with warnings as errors
        run: uv run --locked --group docs --no-default-groups sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Check generated API reference
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              "public-api": "vcsmd.api.initialize",
              "configuration": "vcsmd.config.SimulationConfig.steps",
              "io": "vcsmd.io.load_checkpoint",
              "numerics": "vcsmd.dynamics.step",
          }
          for page, target in required.items():
              html = Path(f"docs/_build/html/reference/{page}.html").read_text()
              assert f'id="{target}"' in html, f"Missing generated API object: {target}"
          PY
      - name: Upload HTML
        uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation-html
          path: docs/_build/html/
          if-no-files-found: error
