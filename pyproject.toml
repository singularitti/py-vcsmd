[project]
name = "vcsmd"
version = "0.1.0"
description = "A Python reimplementation of Renata's VCSMD Fortran code"
readme = "README.md"
authors = [
    { name = "singularitti", email = "singularitti@outlook.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
vcsmd = "vcsmd:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
