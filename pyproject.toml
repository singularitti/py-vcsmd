[project]
name = "vcsmd"
version = "0.1.0"
description = "Pure, unit-aware variable-cell molecular dynamics in Python"
readme = "README.md"
authors = [
    { name = "singularitti", email = "singularitti@outlook.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3",
    "pint>=0.24.4,<0.27",
    "PyYAML>=6,<7",
    "tomli>=2; python_version < '3.11'",
    "tomli-w>=1.2,<2",
]

[project.scripts]
vcsmd = "vcsmd.cli:main"

[dependency-groups]
dev = ["ruff>=0.12", "matplotlib>=3.8"]
docs = [
    "sphinx>=9.1,<10",
    "myst-parser>=5.1,<6",
    "furo>=2025.12.19,<2027",
    "sphinxcontrib-mermaid>=2.1.1,<3",
    "sphinx-autobuild>=2025.8.25,<2027",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
